<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
     <link rel="stylesheet" href="style.css">
    <title>galerias</title>
  </head>
  <body>
    <section >
    <div class="container py-3">
        <div class="texto-seccion text-center">
            <h3>Conoce nuestro gimnasio</h3>
            <span>"Donde el esfuerzo se convierte en resultados."</span>
            <p>Explora nuestra galería y conoce cómo se vive el día a día. Desde nuestras instalaciones equipadas hasta la energía de cada entrenamiento: aquí es donde sucede la transformación.</p>
        </div>
        <div class="row row-cols-1 row-cols-md-3 g-4 mb-5">
            <div class="col">
                <div class="card h-100 shadow-sm overflow-hidden">
                    <img src="./imagenes/pilates.jpg" class="card-img-top img-gallery" alt="Pilates">
                </div>
            </div>
            <div class="col">
                <div class="card h-100 shadow-sm overflow-hidden">
                    <img src="./imagenes/natacion.png" class="card-img-top img-gallery" alt="Natación">
                </div>
            </div>
            <div class="col">
                <div class="card h-100 shadow-sm overflow-hidden">
                    <img src="./imagenes/crossfit.png" class="card-img-top img-gallery" alt="Crossfit">
                </div>
            </div>
        </div>
        <div class="row row-cols-1 row-cols-md-3 g-4 mb-5">
            <div class="col">
                <div class="card h-100 shadow-sm overflow-hidden">
                    <img src="./imagenes/gimnasio.png" class="card-img-top img-gallery" alt="gimnasio">
                </div>
            </div>
            <div class="col">
                <div class="card h-100 shadow-sm overflow-hidden">
                    <img src="./imagenes/spinning.png" class="card-img-top img-gallery" alt="pining">
                </div>
            </div>
            <div class="col">
                <div class="card h-100 shadow-sm overflow-hidden">
                    <img src="./imagenes/localGym.png" class="card-img-top img-gallery" alt="local del gimnasios">
                </div>
            </div>
        </div>
</section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
